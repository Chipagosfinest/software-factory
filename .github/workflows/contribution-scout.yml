name: Contribution scout

on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan upstream issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contribution-scout.mjs contribution-scout.md
      - uses: actions/upload-artifact@v4
        with:
          name: contribution-scout
          path: contribution-scout.md
